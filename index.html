<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Malawi National Examinations Board</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f5fa;
    color: #17233b;
    min-height: 100vh;
    transition: 0.3s;
}

/* ================= HEADER ================= */

.header {
    background: linear-gradient(135deg, #09244d, #1769aa);
    color: white;
    text-align: center;
    padding: 38px 18px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
}

/* ================= MAIN ================= */

.container {
    width: 92%;
    max-width: 720px;
    margin: 45px auto;
}

/* ================= CARD ================= */

.card {
    background: white;
    border-radius: 30px;
    padding: 32px 30px 38px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

/* ================= LOGO ================= */

.logo-box {
    text-align: center;
    margin-bottom: 25px;
}

.maneb-logo {
    width: 190px;
    height: 190px;
    object-fit: contain;
    display: block;
    margin: auto;
}

/* ================= TITLE ================= */

.card h2 {
    text-align: center;
    margin: 0 0 35px;
    font-size: 32px;
    font-weight: 800;
}

/* ================= LABEL ================= */

label {
    display: block;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 12px;
}

/* ================= INPUT ================= */

input {
    width: 100%;
    height: 70px;
    border: 1px solid #ccd3dc;
    border-radius: 18px;
    padding: 0 20px;
    font-size: 19px;
    background: white;
    color: #17233b;
    outline: none;
    margin-bottom: 26px;
}

input:focus {
    border: 2px solid #1769aa;
}

/* ================= BUTTON ================= */

button {
    width: 100%;
    height: 72px;
    border: none;
    border-radius: 18px;
    background: #1769aa;
    color: white;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

/* ================= MESSAGE ================= */

.message {
    display: none;
    margin-top: 20px;
    padding: 16px;
    border-radius: 14px;
    background: #fff3cd;
    color: #664d03;
    font-size: 16px;
}

/* ================= RESULTS ================= */

#results {
    display: none;
    margin-top: 30px;
}

.result-header {
    background: white;
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
}

/* LARGE BLUE NAME */

.candidate-name {
    color: #1769aa;
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 15px;
    line-height: 1.15;
}

/* SCHOOL */

.school-name {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 18px;
}

/* RESULT INFORMATION */

.result-info {
    margin: 8px 0;
    font-size: 17px;
}

/* ================= TABLE ================= */

.result-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
}

.result-table th {
    background: #1769aa;
    color: white;
    padding: 17px 14px;
    text-align: left;
    font-size: 17px;
}

.result-table td {
    padding: 17px 14px;
    border-bottom: 1px solid #e3e7ed;
    font-size: 17px;
}

/* ================= MSCE BEST SIX ================= */

.best-six {
    background: linear-gradient(135deg, #09244d, #1769aa);
    color: white;
    border-radius: 25px;
    padding: 28px;
    text-align: center;
    margin-bottom: 22px;
}

.best-six small {
    display: block;
    font-size: 17px;
    margin-bottom: 8px;
}

.best-six strong {
    display: block;
    font-size: 42px;
}

/* ================= OVERALL RESULT ================= */

.overall-result {
    margin-top: 22px;
    margin-bottom: 20px;
    padding: 22px;
    border-radius: 20px;
    text-align: center;
    border: 3px solid;
}

.overall-title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.overall-status {
    font-size: 34px;
    font-weight: 900;
}

.overall-pass {
    background: #e8f8ef;
    color: #087f3e;
    border-color: #198754;
}

.overall-fail {
    background: #fdeaea;
    color: #c82333;
    border-color: #dc3545;
}

/* ================= BUTTONS ================= */

.print-btn {
    margin-top: 15px;
}

.back-btn {
    margin-top: 15px;
    background: #17233b;
}

/* ================= FOOTER ================= */

.footer {
    text-align: center;
    margin: 50px 20px 35px;
    color: #68758a;
    font-size: 15px;
    line-height: 1.9;
}

.footer strong {
    color: #17233b;
}

/* ================= THEME BUTTON ================= */

.theme-button {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #17233b;
    color: white;
    font-size: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
    cursor: pointer;
    z-index: 20;
}

/* ================= DARK MODE ================= */

body.dark {
    background: #080b10;
    color: white;
}

body.dark .card,
body.dark .result-header,
body.dark .result-table {
    background: #15181d;
    color: white;
}

body.dark .candidate-name {
    color: #4da3ff;
}

body.dark .result-table td {
    border-bottom-color: #30343b;
}

body.dark input {
    background: #24272c;
    color: white;
    border-color: #454a53;
}

body.dark input::placeholder {
    color: #aeb4bd;
}

body.dark .footer {
    color: #aeb4bd;
}

body.dark .footer strong {
    color: white;
}

body.dark .overall-pass {
    background: #103a25;
    color: #5ee596;
}

body.dark .overall-fail {
    background: #421a20;
    color: #ff737d;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .header {
        padding: 35px 15px;
    }

    .header h1 {
        font-size: 24px;
        line-height: 1.3;
    }

    .container {
        width: 94%;
        margin-top: 30px;
    }

    .card {
        padding: 28px 20px 32px;
    }

    .maneb-logo {
        width: 155px;
        height: 155px;
    }

    .card h2 {
        font-size: 29px;
    }

    label {
        font-size: 19px;
    }

    input {
        height: 65px;
        font-size: 18px;
    }

    button {
        height: 68px;
        font-size: 20px;
    }

    .candidate-name {
        font-size: 30px;
    }

    .school-name {
        font-size: 19px;
    }

    .result-table th,
    .result-table td {
        padding: 14px 10px;
        font-size: 15px;
    }

    .best-six strong {
        font-size: 36px;
    }

    .overall-status {
        font-size: 29px;
    }
}

</style>
</head>

const candidates = {

    "JCE2026001": {

        examType: "JCE",

        school: "Lilongwe Secondary School",

        dob: "2010-08-21",

        overallStatus: "PASS",

        subjects: [

            {
                name: "Agriculture",
                mark: 72,

            },

            {
                name: "Biology",

            {

        school: "Mzuzu Secondary School",

        dob: "2008-03-20",

        overallStatus: "PASS",

        subjects: [

            {

/* =====================================================
   HTML SECURITY
   ===================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   CHECK RESULTS
   ===================================================== */

function checkResults() {

    const examNumber =
        document
        .getElementById("examNumber")
        .value
        .trim()
        .toUpperCase();

    const dob =
        document
        .getElementById("dob")
        .value;

    const message =
        document
        .getElementById("message");

    const results =
        document
        .getElementById("results");


    message.style.display = "none";

    results.style.display = "none";

    results.innerHTML = "";


    if (!examNumber || !dob) {

        message.textContent =
            "Please enter your examination number and date of birth.";

        message.style.display = "block";

        return;
    }


    const candidate =
        candidates[examNumber];


    if (!candidate) {

        message.textContent =
            "No result found for this examination number.";

        message.style.display = "block";

        return;
    }


    if (candidate.dob !== dob) {

        message.textContent =
            "The date of birth does not match the record.";

        message.style.display = "block";

        return;
    }


    if (
        candidate.examType === "MSCE"
    ) {

        displayMSCE(
            candidate,
            examNumber
        );

    } else {

        displayStandard(
            candidate,
            examNumber
        );

    }

}


/* =====================================================
   OVERALL RESULT
   ===================================================== */

function createOverallResult(candidate) {

    const status =
        String(
            candidate.overallStatus || ""
        ).toUpperCase();


    if (
        status !== "PASS" &&
        status !== "FAIL"
    ) {
        return "";
    }


    const className =
        status === "PASS"
        ? "overall-pass"
        : "overall-fail";


    return `

        <div class="overall-result ${className}">

            <div class="overall-title">
                OVERALL RESULTS
            </div>

            <div class="overall-status">
                ${status}
            </div>

        </div>

    `;

}


/* =====================================================
   PSLCE + JCE
   SUBJECT + GRADE ONLY
   ===================================================== */

function displayStandard(
    candidate,
    examNumber
) {

    const results =
        document
        .getElementById("results");


    const subjects =
        [...candidate.subjects].sort(
            (a, b) =>
                a.name.localeCompare(b.name)
        );


    let rows = "";


    subjects.forEach(subject => {

        rows += `

            <tr>

                <td>
                    ${escapeHtml(subject.name)}
                </td>

                <td>
                    <strong>
                        ${escapeHtml(subject.grade)}
                    </strong>
                </td>

            </tr>

        `;

    });


    results.innerHTML = `

        <div class="result-header">

            <div class="candidate-name">
                ${escapeHtml(candidate.name)}
            </div>

            <div class="school-name">
                ${escapeHtml(candidate.school)}
            </div>

            <p class="result-info">

                <strong>
                    Examination:
                </strong>

                ${escapeHtml(candidate.examType)}

            </p>

            <p class="result-info">

                <strong>
                    Examination Number:
                </strong>

                ${escapeHtml(examNumber)}

            </p>

            <p class="result-info">

                <strong>
                    Date of Birth:
                </strong>

                ${formatDate(candidate.dob)}

            </p>

        </div>


        <table class="result-table">

            <thead>

                <tr>

                    <th>
                        Subject
                    </th>

                    <th>
                        Grade
                    </th>

                </tr>

            </thead>

            <tbody>

                ${rows}

            </tbody>

        </table>


        ${createOverallResult(candidate)}


        <button
            class="print-btn"
            onclick="printCertificate('${escapeHtml(examNumber)}')"
        >
            🖨 PRINT RESULTS
        </button>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            CHECK ANOTHER RESULT
        </button>

    `;


    results.style.display = "block";

}


/* =====================================================
   MSCE
   SUBJECT + POINTS
   ===================================================== */

function displayMSCE(
    candidate,
    examNumber
) {

    const results =
        document
        .getElementById("results");


    const subjects =
        [...candidate.subjects].sort(
            (a, b) =>
                a.name.localeCompare(b.name)
        );


    const sortedPoints =
        subjects
        .map(
            subject =>
                Number(subject.points)
        )
        .filter(
            points =>
                !Number.isNaN(points)
        )
        .sort(
            (a, b) =>
                a - b
        );


    const bestSix =
        sortedPoints.slice(0, 6);


    const bestSixTotal =
        bestSix.reduce(
            (total, points) =>
                total + points,
            0
        );


    let rows = "";


    subjects.forEach(subject => {

        rows += `

            <tr>

                <td>
                    ${escapeHtml(subject.name)}
                </td>

                <td>
                    <strong>
                        ${escapeHtml(subject.points)}
                    </strong>
                </td>

            </tr>

        `;

    });


    results.innerHTML = `

        <div class="result-header">

            <div class="candidate-name">
                ${escapeHtml(candidate.name)}
            </div>

            <div class="school-name">
                ${escapeHtml(candidate.school)}
            </div>

            <p class="result-info">

                <strong>
                    Examination:
                </strong>

                MSCE

            </p>

            <p class="result-info">

                <strong>
                    Examination Number:
                </strong>

                ${escapeHtml(examNumber)}

            </p>

            <p class="result-info">

                <strong>
                    Date of Birth:
                </strong>

                ${formatDate(candidate.dob)}

            </p>

        </div>


        <div class="best-six">

            <small>
                BEST SIX SUBJECT TOTAL
            </small>

            <strong>
                ${bestSixTotal} POINTS
            </strong>

        </div>


        <table class="result-table">

            <thead>

                <tr>

                    <th>
                        Subject
                    </th>

                    <th>
                        Points
                    </th>

                </tr>

            </thead>

            <tbody>

                ${rows}

            </tbody>

        </table>


        ${createOverallResult(candidate)}


        <button
            class="print-btn"
            onclick="printCertificate('${escapeHtml(examNumber)}')"
        >
            🖨 PRINT RESULTS
        </button>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            CHECK ANOTHER RESULT
        </button>

    `;


    results.style.display = "block";

}


/* =====================================================
   PRINT CERTIFICATE-STYLE RESULTS
   ===================================================== */

function printCertificate(examNumber) {

    const candidate =
        candidates[examNumber];


    if (!candidate) {
        return;
    }


    const subjects =
        [...candidate.subjects].sort(
            (a, b) =>
                a.name.localeCompare(b.name)
        );


    let resultRows = "";


    /* ================= PSLCE + JCE ================= */

    if (
        candidate.examType !== "MSCE"
    ) {

        subjects.forEach(subject => {

            resultRows += `

                <tr>

                    <td>
                        ${escapeHtml(subject.name)}
                    </td>

                    <td class="grade-cell">
                        ${escapeHtml(subject.grade)}
                    </td>

                </tr>

            `;

        });

    }


    /* ================= MSCE ================= */

    else {

        subjects.forEach(subject => {

            resultRows += `

                <tr>

                    <td>
                        ${escapeHtml(subject.name)}
                    </td>

                    <td class="points-cell">
                        ${escapeHtml(subject.points)}
                    </td>

                </tr>

            `;

        });

    }


    /* ================= BEST SIX ================= */

    let bestSixHTML = "";


    if (
        candidate.examType === "MSCE"
    ) {

        const points =
            subjects
            .map(
                subject =>
                    Number(subject.points)
            )
            .filter(
                point =>
                    !Number.isNaN(point)
            )
            .sort(
                (a, b) =>
                    a - b
            )
            .slice(0, 6);


        const total =
            points.reduce(
                (a, b) =>
                    a + b,
                0
            );


        bestSixHTML = `

            <div class="best-six-print">

                <div>
                    BEST SIX SUBJECT TOTAL
                </div>

                <strong>
                    ${total} POINTS
                </strong>

            </div>

        `;

    }


    /* ================= OVERALL ================= */

    const overall =
        String(
            candidate.overallStatus || ""
        ).toUpperCase();


    let overallHTML = "";


    if (
        overall === "PASS" ||
        overall === "FAIL"
    ) {

        const overallClass =
            overall === "PASS"
            ? "pass-print"
            : "fail-print";


        overallHTML = `

            <div class="overall-print ${overallClass}">

                <small>
                    OVERALL RESULTS
                </small>

                <strong>
                    ${overall}
                </strong>

            </div>

        `;

    }


    const popup =
        window.open(
            "",
            "_blank",
            "width=1000,height=800"
        );


    if (!popup) {

        alert(
            "Please allow pop-ups to print your results."
        );

        return;
    }


    popup.document.write(`

/* ================= CANDIDATE ================= */

/* ================= DETAILS ================= */

.details {

/* ================= BEST SIX ================= */

    font-family: Arial, sans-serif;

    font-weight: 900;

    color: #09244d;

}


table {

    width: 100%;

    border-collapse: collapse;

    margin-top: 3mm;

    font-family: Arial, sans-serif;

    font-size: 12px;

}


th {

    background: #09244d;

    color: white;

    padding: 2.5mm;

    border: 1px solid #09244d;

    text-align: left;

td {

/* ================= OVERALL ================= */

/* ================= FOOTER ================= */

/* ================= PRINT BUTTON ================= */

.print-control {

.print-control button {

/* =====================================================
   DATE FORMAT
   ===================================================== */

function formatDate(dateString) {

    const date =
        new Date(
            dateString + "T00:00:00"
        );


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const year =
        date.getFullYear();


    return `${day}/${month}/${year}`;

}


/* =====================================================
   BACK
   ===================================================== */

function goBack() {

    const results =
        document.getElementById("results");


    results.style.display = "none";

    results.innerHTML = "";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =====================================================
   DARK MODE
   ===================================================== */

function toggleDarkMode() {

    document
        .body
        .classList
        .toggle("dark");


    const dark =
        document
        .body
        .classList
        .contains("dark");


    const logo =
        document.getElementById("manebLogo");


    const button =
        document.getElementById("themeButton");


    if (dark) {

        logo.src =
            "file_000000002628821199081fb1e2d95150.png";

        button.textContent =
            "☀";

    }

    else {

        logo.src =
            "1788618691958.jpg";

        button.textContent =
            "☾";

    }

}
