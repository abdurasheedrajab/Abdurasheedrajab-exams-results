<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABDURASHEEDRAJAB WORLD EXAMS- Examination Results</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f5fa;
    color: #17233b;
    min-height: 100vh;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #09244d, #1769aa);
    color: white;
    text-align: center;
    padding: 38px 20px 42px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
}

.header p {
    margin: 12px 0 0;
    font-size: 18px;
    opacity: 0.95;
}

/* MAIN */
.container {
    width: 92%;
    max-width: 720px;
    margin: 60px auto 0;
}

/* RESULT CARD */
.card {
    background: white;
    border-radius: 30px;
    padding: 34px 30px 38px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

/* MANEB LOGO */
.maneb-logo {
    display: block;
    width: 180px;
    height: 180px;
    object-fit: contain;
    margin: 0 auto 22px;
}

/* TITLE */
.card h2 {
    text-align: center;
    margin: 0 0 35px;
    font-size: 34px;
    font-weight: 800;
}

/* LABELS */
label {
    display: block;
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 12px;
}

/* INPUTS */
input,
select {
    width: 100%;
    height: 70px;
    border: 1px solid #ccd3dc;
    border-radius: 18px;
    padding: 0 20px;
    font-size: 19px;
    background: white;
    color: #17233b;
    outline: none;
    margin-bottom: 26px;
}

input:focus,
select:focus {
    border: 2px solid #1769aa;
}

/* BUTTON */
button {
    width: 100%;
    height: 72px;
    border: none;
    border-radius: 18px;
    background: #1769aa;
    color: white;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 5px;
}

button:active {
    transform: scale(0.98);
}

/* RESULTS */
#results {
    display: none;
    margin-top: 30px;
}

/* RESULT HEADER */
.result-header {
    background: white;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
    margin-bottom: 20px;
}

.result-header h2 {
    margin: 0 0 15px;
    font-size: 27px;
}

.result-header p {
    margin: 7px 0;
    font-size: 17px;
}

/* TABLE */
.result-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
}

.result-table th,
.result-table td {
    padding: 17px 14px;
    border-bottom: 1px solid #e3e7ed;
    text-align: left;
}

.result-table th {
    background: #1769aa;
    color: white;
    font-size: 17px;
}

.result-table td {
    font-size: 17px;
}

/* MSCE BEST SIX */
.best-six {
    background: linear-gradient(135deg, #09244d, #1769aa);
    color: white;
    border-radius: 25px;
    padding: 28px;
    text-align: center;
    margin-bottom: 22px;
}

.best-six small {
    display: block;
    font-size: 17px;
    margin-bottom: 8px;
}

.best-six strong {
    display: block;
    font-size: 42px;
}

/* BACK BUTTON */
.back-btn {
    margin-top: 22px;
    background: #17233b;
}

/* MESSAGE */
.message {
    margin-top: 20px;
    padding: 17px;
    border-radius: 15px;
    background: #fff3cd;
    color: #664d03;
    font-size: 16px;
    display: none;
}

/* FOOTER */
.footer {
    text-align: center;
    margin: 70px 20px 40px;
    color: #68758a;
    font-size: 16px;
    line-height: 1.7;
}

.footer strong {
    color: #17233b;
}

/* DISCLAIMER */
.disclaimer {
    max-width: 700px;
    margin: 25px auto 0;
    padding: 15px;
    border-radius: 12px;
    background: #fff3cd;
    color: #665200;
    font-size: 13px;
}

/* DARK MODE */
.dark {
    background: #0d1524;
    color: white;
}

.dark .card,
.dark .result-header,
.dark .result-table {
    background: #172236;
    color: white;
}

.dark input,
.dark select {
    background: #101a2b;
    color: white;
    border-color: #39465b;
}

.dark .footer {
    color: #aab5c7;
}

.dark .footer strong {
    color: white;
}

/* THEME BUTTON */
.theme-button {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #17233b;
    color: white;
    font-size: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
    cursor: pointer;
    z-index: 20;
}

/* MOBILE */
@media (max-width: 600px) {

    .header {
        padding: 34px 15px 38px;
    }

    .header h1 {
        font-size: 25px;
    }

    .header p {
        font-size: 17px;
    }

    .container {
        width: 94%;
        margin-top: 35px;
    }

    .card {
        padding: 28px 20px 30px;
        border-radius: 27px;
    }

    .maneb-logo {
        width: 145px;
        height: 145px;
        margin-bottom: 18px;
    }

    .card h2 {
        font-size: 29px;
        margin-bottom: 30px;
    }

    label {
        font-size: 19px;
    }

    input,
    select {
        height: 65px;
        font-size: 18px;
    }

    button {
        height: 68px;
        font-size: 20px;
    }

    .result-table th,
    .result-table td {
        padding: 14px 10px;
        font-size: 15px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
    <h1>THE MALAWI NATION EXAMINATIONS BOARD</h1>
    <p>Modern Examination Results Portal</p>
</header>


<!-- MAIN -->
<main class="container">

    <!-- SEARCH CARD -->
    <section class="card">

        <!-- REAL MANEB LOGO -->
        <img
            src="1788618691958.jpg"
            alt="Malawi National Examinations Board logo"
            class="maneb-logo"
        >

        <h2>Check Examination Results</h2>

        <label for="examType">Examination</label>

        <select id="examType">
            <option value="">Select examination</option>
            <option value="PSLCE">PSLCE</option>
            <option value="JCE">JCE</option>
            <option value="MSCE">MSCE</option>
        </select>


        <label for="examNumber">Examination Number</label>

        <input
            type="text"
            id="examNumber"
            placeholder="Example: MSCE2026001"
        >


        <label for="dob">Date of Birth</label>

        <input
            type="date"
            id="dob"
        >


        <button onclick="checkResults()">
            CHECK RESULTS
        </button>

        <div id="message" class="message"></div>

    </section>


    <!-- RESULTS -->
    <section id="results"></section>

</main>



<!-- FOOTER -->
<footer class="footer">

    <strong>
        © 2026 ABDURASHEEDRAJAB 
    </strong>

    <br>

    Designed &amp; Developed by AbdurasheedRajab

    <div class="disclaimer">
        <strong></strong><br>
    </div>

</footer>


<!-- DARK MODE -->
<div class="theme-button" onclick="toggleDarkMode()">
    ☾
</div>


<script>

/* ==========================================
   FICTIONAL DEMO RESULTS
   ========================================== */

const candidates = {

    /* PSLCE */
    "PSLCE2026001": {
        examType: "PSLCE",
        name: "John Banda",
        dob: "2011-09-19",

        subjects: [
            { name: "Arts and Life Skills", mark: 78, grade: "A" },
            { name: "Chichewa", mark: 72, grade: "A" },
            { name: "English", mark: 81, grade: "A" },
            { name: "Mathematics", mark: 75, grade: "A" },
            { name: "Primary Science", mark: 69, grade: "B" },
            { name: "Social and Religious Studies", mark: 73, grade: "A" }
        ]
    },


    /* JCE */
    "JCE2026001": {
        examType: "JCE",
        name: "Peter Phiri",
        dob: "2011-09-19",

        subjects: [
            { name: "Agriculture", mark: 72, grade: "A" },
            { name: "Biology", mark: 68, grade: "B" },
            { name: "Chichewa", mark: 75, grade: "A" },
            { name: "English", mark: 71, grade: "A" },
            { name: "Geography", mark: 64, grade: "B" },
            { name: "History", mark: 70, grade: "A" },
            { name: "Mathematics", mark: 78, grade: "A" },
            { name: "Physics", mark: 66, grade: "B" },
            { name: "Social Studies", mark: 73, grade: "A" }
        ]
    },


    /* MSCE */
    "MSCE2026001": {
        examType: "MSCE",
        name: "Mary Phiri",
        dob: "2011-09-19",

        /*
           MSCE deliberately uses POINTS only.
           There is NO grade field here.
        */
        subjects: [
            { name: "Biology", points: 4 },
            { name: "Chichewa", points: 5 },
            { name: "Chemistry", points: 6 },
            { name: "English", points: 3 },
            { name: "Geography", points: 7 },
            { name: "History", points: 8 },
            { name: "Mathematics", points: 2 },
            { name: "Physics", points: 4 }
        ]
    }

};


/* ==========================================
   CHECK RESULTS
   ========================================== */

function checkResults() {

    const examType =
        document.getElementById("examType").value;

    const examNumber =
        document.getElementById("examNumber").value
        .trim()
        .toUpperCase();

    const dob =
        document.getElementById("dob").value;

    const message =
        document.getElementById("message");

    const results =
        document.getElementById("results");


    message.style.display = "none";
    results.style.display = "none";
    results.innerHTML = "";


    if (!examType || !examNumber || !dob) {

        message.textContent =
            "Please enter the examination, examination number and date of birth.";

        message.style.display = "block";

        return;
    }


    const candidate = candidates[examNumber];


    if (!candidate) {

        message.textContent =
            "No demo result was found for this examination number.";

        message.style.display = "block";

        return;
    }


    if (candidate.examType !== examType) {

        message.textContent =
            "The examination type does not match the examination number.";

        message.style.display = "block";

        return;
    }


    if (candidate.dob !== dob) {

        message.textContent =
            "The date of birth does not match the demo record.";

        message.style.display = "block";

        return;
    }


    displayResults(candidate);
}


/* ==========================================
   DISPLAY RESULTS
   ========================================== */

function displayResults(candidate) {

    const results =
        document.getElementById("results");

    results.style.display = "block";


    /*
       MSCE HAS ITS OWN DISPLAY SYSTEM.
       It does NOT display grades.
    */

    if (candidate.examType === "MSCE") {

        displayMSCE(candidate);

        return;
    }


    /*
       PSLCE AND JCE KEEP THE
       MARK + GRADE FORMAT.
    */

    displayStandard(candidate);
}


/* ==========================================
   PSLCE + JCE
   ========================================== */

function displayStandard(candidate) {

    const results =
        document.getElementById("results");


    const subjects =
        [...candidate.subjects]
        .sort((a, b) =>
            a.name.localeCompare(b.name)
        );


    let rows = "";


    subjects.forEach(subject => {

        rows += `
            <tr>
                <td>${subject.name}</td>
                <td>${subject.mark}</td>
                <td>${subject.grade}</td>
            </tr>
        `;

    });


    results.innerHTML = `

        <div class="result-header">

            <h2>${candidate.examType} Results</h2>

            <p>
                <strong>Candidate:</strong>
                ${candidate.name}
            </p>

            <p>
                <strong>Examination Number:</strong>
                ${candidate.examType === "PSLCE"
                    ? "PSLCE2026001"
                    : "JCE2026001"}
            </p>

            <p>
                <strong>Date of Birth:</strong>
                ${formatDate(candidate.dob)}
            </p>

        </div>


        <table class="result-table">

            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Mark</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody>
                ${rows}
            </tbody>

        </table>


        <button
            class="back-btn"
            onclick="goBack()">
            CHECK ANOTHER RESULT
        </button>

    `;
}


/* ==========================================
   MSCE
   ========================================== */

function displayMSCE(candidate) {

    const results =
        document.getElementById("results");


    /*
       ONLY subjects taken by the learner
       are displayed.
    */

    const subjects =
        [...candidate.subjects]
        .sort((a, b) =>
            a.name.localeCompare(b.name)
        );


    /*
       PROTOTYPE BEST SIX CALCULATION:
       lowest six points are selected.
       
       This is demo logic only and should
       be replaced with the officially
       authorized MANEB calculation.
    */

    const sortedPoints =
        subjects
        .map(subject => subject.points)
        .sort((a, b) => a - b);


    const bestSix =
        sortedPoints.slice(0, 6);


    const bestSixTotal =
        bestSix.reduce(
            (total, points) => total + points,
            0
        );


    let rows = "";


    subjects.forEach(subject => {

        /*
           IMPORTANT:
           MSCE shows ONLY:
           Subject | Points

           NO GRADES.
           NO BEST 6 COLUMN.
        */

        rows += `
            <tr>
                <td>${subject.name}</td>
                <td><strong>${subject.points}</strong></td>
            </tr>
        `;

    });


    results.innerHTML = `

        <div class="result-header">

            <h2>MSCE Results</h2>

            <p>
                <strong>Candidate:</strong>
                ${candidate.name}
            </p>

            <p>
                <strong>Examination Number:</strong>
                MSCE2026001
            </p>

            <p>
                <strong>Date of Birth:</strong>
                ${formatDate(candidate.dob)}
            </p>

        </div>


        <!-- BEST SIX BOX -->

        <div class="best-six">

            <small>
                BEST SIX SUBJECT TOTAL
            </small>

            <strong>
                ${bestSixTotal} POINTS
            </strong>

        </div>


        <!-- MSCE SUBJECT TABLE -->

        <table class="result-table">

            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Points</th>
                </tr>
            </thead>

            <tbody>
                ${rows}
            </tbody>

        </table>


        <button
            class="back-btn"
            onclick="goBack()">
            CHECK ANOTHER RESULT
        </button>

    `;
}


/* ==========================================
   DATE FORMAT
   ========================================== */

function formatDate(dateString) {

    const date =
        new Date(dateString + "T00:00:00");


    const day =
        String(date.getDate()).padStart(2, "0");

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const year =
        date.getFullYear();


    return `${day}/${month}/${year}`;
}


/* ==========================================
   GO BACK
   ========================================== */

function goBack() {

    document.getElementById("results").style.display =
        "none";

    document.getElementById("results").innerHTML =
        "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ==========================================
   DARK MODE
   ========================================== */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    const button =
        document.querySelector(".theme-button");


    if (document.body.classList.contains("dark")) {

        button.textContent = "☀";

    } else {

        button.textContent = "☾";

    }
}

</script>

</body>
    </html>
