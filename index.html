<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDURASHEEDRAJAB WORLD PRO | Examination Results</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f6fb;
    color:#172033;
    min-height:100vh;
}

body.dark{
    background:#111827;
    color:#f3f4f6;
}

header{
    background:linear-gradient(135deg,#071a3d,#1261a8);
    color:white;
    padding:25px 18px;
    text-align:center;
    box-shadow:0 4px 15px #0002;
}

.logo{
    font-size:25px;
    font-weight:800;
    letter-spacing:.5px;
}

.tagline{
    margin-top:7px;
    opacity:.9;
    font-size:14px;
}

.container{
    max-width:900px;
    margin:35px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 30px #00000012;
    margin-bottom:22px;
}

.dark .card{
    background:#1f2937;
}

h2{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:700;
    margin:15px 0 7px;
}

input,select{
    width:100%;
    padding:14px;
    border:1px solid #ccd3df;
    border-radius:10px;
    font-size:16px;
    background:white;
}

.dark input,
.dark select{
    background:#374151;
    color:white;
    border-color:#4b5563;
}

button{
    border:0;
    border-radius:10px;
    padding:14px 20px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
}

.primary{
    width:100%;
    margin-top:20px;
    background:#1261a8;
    color:white;
}

.primary:hover{
    background:#0d4d88;
}

.secondary{
    background:#e7edf5;
    color:#172033;
    margin-top:15px;
}

.dark .secondary{
    background:#374151;
    color:white;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:13px;
    border-radius:10px;
    margin-top:15px;
    display:none;
}

.result-header{
    text-align:center;
    border-bottom:2px solid #e5e7eb;
    padding-bottom:18px;
    margin-bottom:18px;
}

.result-header h1{
    font-size:24px;
}

.student-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
}

.info-box{
    background:#f5f7fa;
    padding:13px;
    border-radius:10px;
}

.dark .info-box{
    background:#374151;
}

.info-box span{
    display:block;
    font-size:12px;
    opacity:.7;
    margin-bottom:4px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    padding:13px 10px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#1261a8;
    color:white;
}

.dark th{
    background:#174d80;
}

.grade{
    font-weight:800;
}

.summary{
    margin-top:20px;
    padding:16px;
    background:#eef6ff;
    border-radius:12px;
}

.dark .summary{
    background:#263b50;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.actions button{
    flex:1;
    min-width:140px;
}

footer{
    text-align:center;
    padding:30px 15px;
    color:#667085;
    font-size:13px;
}

.dark footer{
    color:#aeb8c7;
}

.toggle{
    position:fixed;
    right:15px;
    bottom:15px;
    width:50px;
    height:50px;
    border-radius:50%;
    background:#172033;
    color:white;
    box-shadow:0 5px 15px #0003;
}

@media(max-width:600px){
    .student-info{
        grid-template-columns:1fr;
    }

    .card{
        padding:18px;
    }

    .logo{
        font-size:21px;
    }

    th,td{
        padding:10px 7px;
        font-size:13px;
    }
}

@media print{
    header,
    .search-card,
    .actions,
    .toggle,
    footer{
        display:none !important;
    }

    body{
        background:white;
    }

    .card{
        box-shadow:none;
        border:0;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">ABDURASHEEDRAJAB WORLD PRO</div>
    <div class="tagline">Modern Examination Results Portal</div>
</header>

<div class="container">

    <!-- SEARCH -->
    <div class="card search-card">

        <h2>Check Examination Results</h2>

        <label for="examType">Examination</label>
        <select id="examType">
            <option value="">Select examination</option>
            <option value="PSLCE">PSLCE</option>
            <option value="JCE">JCE</option>
            <option value="MSCE">MSCE</option>
        </select>

        <label for="examNumber">Examination Number</label>
        <input
            id="examNumber"
            type="text"
            placeholder="Example: JCE2026001"
            autocomplete="off"
        >

        <label for="dob">Date of Birth</label>
        <input id="dob" type="date">

        <button class="primary" onclick="checkResults()">
            CHECK RESULTS
        </button>

        <div id="error" class="error"></div>
    </div>

    <!-- RESULT -->
    <div id="resultArea"></div>

</div>

<button class="toggle" onclick="toggleDark()">☾</button>

<footer>
    <strong>© 2026 ABDURASHEEDRAJAB WORLD PRO</strong><br><br>
    Designed & Developed by AbdurasheedRajab<br><br>
    <small>
        DEMO / PROTOTYPE ONLY — This portal uses fictional sample
        examination data and is not an official MANEB system.
    </small>
</footer>

<script>

/* ==========================================================
   SUBJECT CATALOGUE
   ========================================================== */

/* PSLCE — exact subjects requested */
const PSLCE_SUBJECTS = [
    "Arts and Life Skills",
    "Chichewa",
    "English",
    "Mathematics",
    "Primary Science",
    "Social and Religious Studies"
].sort();


/*
   JCE SUBJECT CATALOGUE

   Keep this list separate so that an authorized administrator
   can update it if MANEB changes the official subject catalogue.
*/
const JCE_SUBJECTS = [
    "Agriculture",
    "Bible Knowledge",
    "Biology",
    "Business Studies",
    "Chichewa",
    "Computer Studies",
    "English",
    "French",
    "Geography",
    "History",
    "Home Economics",
    "Life Skills",
    "Mathematics",
    "Physical Education",
    "Physics",
    "Social Studies"
].sort();


/*
   MSCE SUBJECT CATALOGUE

   This is a configurable prototype catalogue.
   For production, the authorized MANEB subject catalogue
   should replace this list.
*/
const MSCE_SUBJECTS = [
    "Accounting",
    "Agriculture",
    "Bible Knowledge",
    "Biology",
    "Business Studies",
    "Chichewa",
    "Chemistry",
    "Clothing and Textiles",
    "Computer Studies",
    "Economics",
    "English",
    "French",
    "Geography",
    "History",
    "Home Economics",
    "Information and Communication Technology",
    "Life Skills",
    "Mathematics",
    "Metalwork",
    "Physical Education",
    "Physics",
    "Social and Life Skills",
    "Social Studies",
    "Technical Drawing",
    "Woodwork"
].sort();


/* ==========================================================
   FICTIONAL DEMO CANDIDATES
   ========================================================== */

const candidates = [

    {
        examType:"PSLCE",
        examNumber:"PSLCE2026001",
        dob:"2012-08-10",
        name:"Peter Mbewe",

        subjects:[
            {
                name:"Arts and Life Skills",
                mark:82,
                grade:"A"
            },
            {
                name:"Chichewa",
                mark:76,
                grade:"B"
            },
            {
                name:"English",
                mark:88,
                grade:"A"
            },
            {
                name:"Mathematics",
                mark:91,
                grade:"A"
            },
            {
                name:"Primary Science",
                mark:85,
                grade:"A"
            },
            {
                name:"Social and Religious Studies",
                mark:79,
                grade:"B"
            }
        ]
    },


    {
        examType:"JCE",
        examNumber:"JCE2026001",
        dob:"2010-05-15",
        name:"John Banda",

        /*
           Notice Agriculture is NOT included.
           Therefore it will NOT appear on John's results.
        */
        subjects:[
            {
                name:"Biology",
                mark:78,
                grade:"B"
            },
            {
                name:"Chichewa",
                mark:81,
                grade:"A"
            },
            {
                name:"English",
                mark:86,
                grade:"A"
            },
            {
                name:"Geography",
                mark:74,
                grade:"B"
            },
            {
                name:"History",
                mark:69,
                grade:"C"
            },
            {
                name:"Mathematics",
                mark:91,
                grade:"A"
            },
            {
                name:"Social Studies",
                mark:80,
                grade:"A"
            }
        ]
    },


    {
        examType:"MSCE",
        examNumber:"MSCE2026001",
        dob:"2008-03-20",
        name:"Mary Phiri",

        /*
           Mary has a different subject combination.
           Only these subjects will appear.
        */
        subjects:[
            {
                name:"Biology",
                mark:88,
                grade:"A"
            },
            {
                name:"Chichewa",
                mark:76,
                grade:"B"
            },
            {
                name:"Chemistry",
                mark:82,
                grade:"A"
            },
            {
                name:"English",
                mark:90,
                grade:"A"
            },
            {
                name:"Geography",
                mark:79,
                grade:"B"
            },
            {
                name:"Mathematics",
                mark:94,
                grade:"A"
            },
            {
                name:"Physics",
                mark:73,
                grade:"B"
            }
        ]
    }

];


/* ==========================================================
   CHECK RESULTS
   ========================================================== */

function checkResults(){

    const examType =
        document.getElementById("examType").value.trim();

    const examNumber =
        document.getElementById("examNumber").value.trim().toUpperCase();

    const dob =
        document.getElementById("dob").value;

    const error =
        document.getElementById("error");

    const resultArea =
        document.getElementById("resultArea");


    error.style.display = "none";
    resultArea.innerHTML = "";


    if(!examType || !examNumber || !dob){

        showError("Please enter the examination, examination number and date of birth.");

        return;
    }


    const candidate = candidates.find(function(c){

        return (
            c.examType === examType &&
            c.examNumber.toUpperCase() === examNumber &&
            c.dob === dob
        );

    });


    if(!candidate){

        showError(
            "No matching result was found. Please check your examination type, examination number and date of birth."
        );

        return;
    }


    displayResults(candidate);
}


/* ==========================================================
   DISPLAY RESULTS
   ========================================================== */

function displayResults(candidate){

    const resultArea =
        document.getElementById("resultArea");


    /*
       Sort only the subjects that the candidate actually took.
       Subjects not present in candidate.subjects are never shown.
    */

    const subjects =
        [...candidate.subjects].sort(function(a,b){

            return a.name.localeCompare(b.name);

        });


    let total = 0;


    subjects.forEach(function(subject){

        total += Number(subject.mark);

    });


    const average =
        subjects.length > 0
        ? (total / subjects.length).toFixed(1)
        : "0";


    let rows = "";


    subjects.forEach(function(subject){

        rows += `
            <tr>
                <td>${escapeHTML(subject.name)}</td>
                <td>${subject.mark}</td>
                <td class="grade">${escapeHTML(subject.grade)}</td>
            </tr>
        `;

    });


    resultArea.innerHTML = `

        <div class="card">

            <div class="result-header">

                <h1>EXAMINATION RESULT</h1>

                <p>
                    ${escapeHTML(candidate.examType)}
                </p>

            </div>


            <div class="student-info">

                <div class="info-box">
                    <span>Candidate Name</span>
                    <strong>${escapeHTML(candidate.name)}</strong>
                </div>

                <div class="info-box">
                    <span>Examination Number</span>
                    <strong>${escapeHTML(candidate.examNumber)}</strong>
                </div>

                <div class="info-box">
                    <span>Date of Birth</span>
                    <strong>${formatDate(candidate.dob)}</strong>
                </div>

                <div class="info-box">
                    <span>Examination</span>
                    <strong>${escapeHTML(candidate.examType)}</strong>
                </div>

            </div>


            <h3>Subjects and Results</h3>

            <table>

                <thead>

                    <tr>
                        <th>Subject</th>
                        <th>Mark</th>
                        <th>Grade</th>
                    </tr>

                </thead>

                <tbody>

                    ${rows}

                </tbody>

            </table>


            <div class="summary">

                <strong>Number of Subjects:</strong>
                ${subjects.length}

                <br><br>

                <strong>Total Marks:</strong>
                ${total}

                <br><br>

                <strong>Average:</strong>
                ${average}%

            </div>


            <div class="actions">

                <button class="primary"
                    onclick="window.print()">
                    PRINT RESULT
                </button>

                <button class="secondary"
                    onclick="newSearch()">
                    NEW SEARCH
                </button>

            </div>

        </div>

    `;


    resultArea.scrollIntoView({
        behavior:"smooth"
    });
}


/* ==========================================================
   HELPERS
   ========================================================== */

function showError(message){

    const error =
        document.getElementById("error");

    error.textContent = message;
    error.style.display = "block";
}


function newSearch(){

    document.getElementById("resultArea").innerHTML = "";

    document.getElementById("examNumber").value = "";

    document.getElementById("dob").value = "";

    document.getElementById("examType").value = "";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function formatDate(dateString){

    const parts =
        dateString.split("-");

    return parts[2] + "/" + parts[1] + "/" + parts[0];
}


/*
   Prevent candidate names/subjects from being interpreted
   as HTML when the system eventually uses external data.
*/
function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ==========================================================
   DARK MODE
   ========================================================== */

function toggleDark(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
            ? "on"
            : "off"
    );
}


if(localStorage.getItem("darkMode") === "on"){

    document.body.classList.add("dark");

}

</script>

</body>
</html>
